name: Usage Dashboard Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-dashboard/**"
      - "scripts/usage-dashboard.sh"
      - "scripts/usage-dashboard.ts"
      - "scripts/tests/usage-dashboard-agreement.test.ts"
      - "scripts/tests/usage-dashboard-crosscheck.test.ts"
      - "scripts/tests/usage-dashboard-buckets.test.ts"
      - "scripts/tests/usage-dashboard-render.test.ts"
      - "scripts/tests/usage-dashboard-empty.test.ts"
      - "scripts/tests/usage-dashboard-page.test.ts"
      - "scripts/tests/usage-dashboard-static.test.ts"
      - "scripts/tests/usage-dashboard-home-marker.test.ts"
      - "scripts/tests/usage-dashboard-server.test.ts"
      - "scripts/tests/usage-dashboard-readonly.test.ts"
      - "scripts/tests/usage-dashboard-mutations.test.ts"
      - "scripts/tests/lib/usage-dashboard-rig.ts"
      - "scripts/tests/lib/usage-dashboard-serve.ts"
      - "scripts/tests/lib/usage-dashboard-views.ts"
      - "scripts/tests/lib/usage-dashboard-checks.ts"
      - "scripts/tests/lib/usage-dashboard-cells.ts"
      - "scripts/tests/lib/usage-dashboard-text.ts"
      - "scripts/tests/lib/usage-dashboard-mutate.ts"
      - "scripts/tests/lib/mutation-copy.ts"
      - "scripts/tests/lib/capability.ts"
      - "scripts/tests/fixtures/usage-dashboard/**"
      - "scripts/tests/fixtures/usage-pricing/**"
      - "model-prices.org.json"
      - "scripts/lib/usage-store/**"
      - "scripts/lib/usage-price/**"
      - "scripts/usage-query.sh"
      - "scripts/usage-query.ts"
      - "scripts/usage-price.sh"
      - "scripts/usage-price.ts"
      - "scripts/usage-attribute.sh"
      - "scripts/usage-attribute.ts"
      - "scripts/usage-prune.sh"
      - "scripts/usage-prune.ts"
      - "schemas/usage-record/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-dashboard/**"
      - "scripts/usage-dashboard.sh"
      - "scripts/usage-dashboard.ts"
      - "scripts/tests/usage-dashboard-agreement.test.ts"
      - "scripts/tests/usage-dashboard-crosscheck.test.ts"
      - "scripts/tests/usage-dashboard-buckets.test.ts"
      - "scripts/tests/usage-dashboard-render.test.ts"
      - "scripts/tests/usage-dashboard-empty.test.ts"
      - "scripts/tests/usage-dashboard-page.test.ts"
      - "scripts/tests/usage-dashboard-static.test.ts"
      - "scripts/tests/usage-dashboard-home-marker.test.ts"
      - "scripts/tests/usage-dashboard-server.test.ts"
      - "scripts/tests/usage-dashboard-readonly.test.ts"
      - "scripts/tests/usage-dashboard-mutations.test.ts"
      - "scripts/tests/lib/usage-dashboard-rig.ts"
      - "scripts/tests/lib/usage-dashboard-serve.ts"
      - "scripts/tests/lib/usage-dashboard-views.ts"
      - "scripts/tests/lib/usage-dashboard-checks.ts"
      - "scripts/tests/lib/usage-dashboard-cells.ts"
      - "scripts/tests/lib/usage-dashboard-text.ts"
      - "scripts/tests/lib/usage-dashboard-mutate.ts"
      - "scripts/tests/lib/mutation-copy.ts"
      - "scripts/tests/lib/capability.ts"
      - "scripts/tests/fixtures/usage-dashboard/**"
      - "scripts/tests/fixtures/usage-pricing/**"
      - "model-prices.org.json"
      - "scripts/lib/usage-store/**"
      - "scripts/lib/usage-price/**"
      - "scripts/usage-query.sh"
      - "scripts/usage-query.ts"
      - "scripts/usage-price.sh"
      - "scripts/usage-price.ts"
      - "scripts/usage-attribute.sh"
      - "scripts/usage-attribute.ts"
      - "scripts/usage-prune.sh"
      - "scripts/usage-prune.ts"
      - "schemas/usage-record/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  usage-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate the usage dashboard's three delivery forms (no network, no daemon)
        run: bash scripts/ci-cache-guard.sh --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-dashboard-agreement.test.ts scripts/tests/usage-dashboard-crosscheck.test.ts scripts/tests/usage-dashboard-buckets.test.ts scripts/tests/usage-dashboard-render.test.ts scripts/tests/usage-dashboard-empty.test.ts scripts/tests/usage-dashboard-page.test.ts scripts/tests/usage-dashboard-static.test.ts scripts/tests/usage-dashboard-home-marker.test.ts scripts/tests/usage-dashboard-server.test.ts scripts/tests/usage-dashboard-readonly.test.ts scripts/tests/usage-dashboard-mutations.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
