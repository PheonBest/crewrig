name: Usage Pricing Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-price/**"
      - "scripts/usage-price.ts"
      - "scripts/tests/usage-pricing-compute.test.ts"
      - "scripts/tests/usage-pricing-fx.test.ts"
      - "scripts/tests/usage-pricing-rollup.test.ts"
      - "scripts/tests/usage-pricing-rollup-period.test.ts"
      - "scripts/tests/usage-pricing-prune.test.ts"
      - "scripts/tests/usage-pricing-static.test.ts"
      - "scripts/tests/usage-pricing-conversion.test.ts"
      - "scripts/tests/usage-pricing-conversion-b.test.ts"
      - "scripts/tests/lib/usage-pricing-rig.ts"
      - "scripts/tests/lib/usage-pricing-driver.ts"
      - "scripts/tests/lib/usage-pricing-case-kit.ts"
      - "scripts/tests/lib/usage-pricing-conversion-world.ts"
      - "scripts/tests/fixtures/usage-pricing/**"
      - "model-prices.org.json"
      - "scripts/lib/usage-store/**"
      - "scripts/usage-attribute.ts"
      - "scripts/usage-prune.ts"
      - "scripts/usage-query.ts"
      - "scripts/lib/usage-dashboard/**"
      - "scripts/usage-dashboard.ts"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-price/**"
      - "scripts/usage-price.ts"
      - "scripts/tests/usage-pricing-compute.test.ts"
      - "scripts/tests/usage-pricing-fx.test.ts"
      - "scripts/tests/usage-pricing-rollup.test.ts"
      - "scripts/tests/usage-pricing-rollup-period.test.ts"
      - "scripts/tests/usage-pricing-prune.test.ts"
      - "scripts/tests/usage-pricing-static.test.ts"
      - "scripts/tests/usage-pricing-conversion.test.ts"
      - "scripts/tests/usage-pricing-conversion-b.test.ts"
      - "scripts/tests/lib/usage-pricing-rig.ts"
      - "scripts/tests/lib/usage-pricing-driver.ts"
      - "scripts/tests/lib/usage-pricing-case-kit.ts"
      - "scripts/tests/lib/usage-pricing-conversion-world.ts"
      - "scripts/tests/fixtures/usage-pricing/**"
      - "model-prices.org.json"
      - "scripts/lib/usage-store/**"
      - "scripts/usage-attribute.ts"
      - "scripts/usage-prune.ts"
      - "scripts/usage-query.ts"
      - "scripts/lib/usage-dashboard/**"
      - "scripts/usage-dashboard.ts"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  usage-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate the model-id resolution, arithmetic, and prune reach (no network)
        run: bash scripts/ci-cache-guard.sh --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-pricing-compute.test.ts scripts/tests/usage-pricing-fx.test.ts scripts/tests/usage-pricing-rollup.test.ts scripts/tests/usage-pricing-rollup-period.test.ts scripts/tests/usage-pricing-prune.test.ts scripts/tests/usage-pricing-static.test.ts scripts/tests/usage-pricing-conversion.test.ts scripts/tests/usage-pricing-conversion-b.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
