name: Usage Attribution Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-store/**"
      - "scripts/lib/usage-capture/**"
      - "scripts/usage-task.ts"
      - "scripts/usage-attribute.ts"
      - "scripts/tests/usage-attribution-channels.test.ts"
      - "scripts/tests/usage-attribution-ledger-rollup.test.ts"
      - "scripts/tests/usage-attribution-period-rollup.test.ts"
      - "scripts/tests/usage-attribution-prune.test.ts"
      - "scripts/tests/usage-attribution-mutations.test.ts"
      - "scripts/tests/lib/usage-attribution-rig.ts"
      - "scripts/tests/lib/usage-attribution-driver.ts"
      - "scripts/tests/lib/usage-attribution-prune-rig.ts"
      - "scripts/tests/lib/usage-mutants.ts"
      - "scripts/tests/lib/mutation-copy.ts"
      - "scripts/tests/lib/capability.ts"
      - "scripts/tests/fixtures/usage-attribution/**"
      - "docs/usage-attribution.md"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-store/**"
      - "scripts/lib/usage-capture/**"
      - "scripts/usage-task.ts"
      - "scripts/usage-attribute.ts"
      - "scripts/tests/usage-attribution-channels.test.ts"
      - "scripts/tests/usage-attribution-ledger-rollup.test.ts"
      - "scripts/tests/usage-attribution-period-rollup.test.ts"
      - "scripts/tests/usage-attribution-prune.test.ts"
      - "scripts/tests/usage-attribution-mutations.test.ts"
      - "scripts/tests/lib/usage-attribution-rig.ts"
      - "scripts/tests/lib/usage-attribution-driver.ts"
      - "scripts/tests/lib/usage-attribution-prune-rig.ts"
      - "scripts/tests/lib/usage-mutants.ts"
      - "scripts/tests/lib/mutation-copy.ts"
      - "scripts/tests/lib/capability.ts"
      - "scripts/tests/fixtures/usage-attribution/**"
      - "docs/usage-attribution.md"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  usage-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate the declaration channels, ledger, and rollups (no daemon)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-attribution-channels.test.ts scripts/tests/usage-attribution-ledger-rollup.test.ts scripts/tests/usage-attribution-period-rollup.test.ts scripts/tests/usage-attribution-prune.test.ts scripts/tests/usage-attribution-mutations.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
